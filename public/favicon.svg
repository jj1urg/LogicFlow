<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Transparent background with high-contrast dark silhouette & vivid signal colors -->

  <!-- Outer dark contrast backing on wires so leads stay crisp on light tabs -->
  <g fill="none" stroke="#091122" stroke-width="10.4" stroke-linecap="round">
    <path d="M 4 21 L 16 21" />
    <path d="M 4 43 L 16 43" />
    <path d="M 52 32 L 60 32" />
  </g>

  <!-- Vivid signal leads: top=1 (green), bottom=Z (blue), output=1 (green) -->
  <path d="M 4 21 L 16 21" fill="none" stroke="#22c55e" stroke-width="6.4" stroke-linecap="round" />
  <path d="M 4 43 L 16 43" fill="none" stroke="#3b82f6" stroke-width="6.4" stroke-linecap="round" />
  <path d="M 52 32 L 60 32" fill="none" stroke="#22c55e" stroke-width="6.8" stroke-linecap="round" />

  <!-- Outer dark silhouette around gate for sharp light-tab contrast -->
  <path
    d="M 16 9 L 29 9 A 23 23 0 0 1 29 55 L 16 55 Z"
    fill="#091122"
    stroke="#091122"
    stroke-width="8.8"
    stroke-linejoin="round"
  />

  <!-- Bold AND Logic Gate Body with bright electric cyan stroke -->
  <path
    d="M 16 9 L 29 9 A 23 23 0 0 1 29 55 L 16 55 Z"
    fill="#0c162d"
    stroke="#38bdf8"
    stroke-width="5.2"
    stroke-linejoin="round"
  />

  <!-- High-contrast luminous signal pulse inside gate -->
  <path
    d="M 22 32 L 26.2 32 L 29.5 22 L 34.5 42 L 38.2 32 L 43 32"
    fill="none"
    stroke="#4ade80"
    stroke-width="4.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 22 32 L 26.2 32 L 29.5 22 L 34.5 42 L 38.2 32 L 43 32"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bold pin nodes -->
  <circle cx="16" cy="21" r="4.9" fill="#4ade80" stroke="#091122" stroke-width="1.8" />
  <circle cx="16" cy="43" r="4.9" fill="#60a5fa" stroke="#091122" stroke-width="1.8" />
  <circle cx="52" cy="32" r="5.3" fill="#4ade80" stroke="#091122" stroke-width="1.8" />
</svg>
