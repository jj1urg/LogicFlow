<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="gateFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowBlue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded dark slate tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="#334155" stroke-width="10" />

  <!-- Subtle dot grid -->
  <g fill="#334155" opacity="0.45">
    <circle cx="96" cy="96" r="4" /><circle cx="176" cy="96" r="4" /><circle cx="256" cy="96" r="4" /><circle cx="336" cy="96" r="4" /><circle cx="416" cy="96" r="4" />
    <circle cx="96" cy="176" r="4" /><circle cx="416" cy="176" r="4" />
    <circle cx="96" cy="256" r="4" /><circle cx="416" cy="256" r="4" />
    <circle cx="96" cy="336" r="4" /><circle cx="416" cy="336" r="4" />
    <circle cx="96" cy="416" r="4" /><circle cx="176" cy="416" r="4" /><circle cx="256" cy="416" r="4" /><circle cx="336" cy="416" r="4" /><circle cx="416" cy="416" r="4" />
  </g>

  <!-- Input wires (top: HIGH green, bottom: Z blue) -->
  <path d="M 68 188 L 154 188" stroke="#22c55e" stroke-width="20" stroke-linecap="round" filter="url(#glowGreen)" />
  <path d="M 68 324 L 154 324" stroke="#3b82f6" stroke-width="20" stroke-linecap="round" filter="url(#glowBlue)" />

  <!-- Output wire (HIGH green with glowing halo) -->
  <path d="M 358 256 L 444 256" stroke="#22c55e" stroke-width="22" stroke-linecap="round" filter="url(#glowGreen)" />

  <!-- Stylized AND Logic Gate Body -->
  <path
    d="M 154 140 L 244 140 C 312 140 358 190 358 256 C 358 322 312 372 244 372 L 154 372 Z"
    fill="url(#gateFill)"
    stroke="#38bdf8"
    stroke-width="16"
    stroke-linejoin="round"
  />

  <!-- Inner pulse / flow chevron inside gate -->
  <path
    d="M 200 256 L 232 256 L 248 220 L 270 292 L 288 256 L 314 256"
    fill="none"
    stroke="#22c55e"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glowGreen)"
  />

  <!-- Pin nodes (4-state color accents) -->
  <circle cx="154" cy="188" r="18" fill="#22c55e" stroke="#0f172a" stroke-width="6" />
  <circle cx="154" cy="324" r="18" fill="#3b82f6" stroke="#0f172a" stroke-width="6" />
  <circle cx="358" cy="256" r="20" fill="#22c55e" stroke="#0f172a" stroke-width="6" />

  <!-- Subtle 4-state dots (0, 1, X, Z) along bottom -->
  <g transform="translate(178, 430)">
    <circle cx="0" cy="0" r="11" fill="#64748b" />
    <circle cx="52" cy="0" r="11" fill="#22c55e" />
    <circle cx="104" cy="0" r="11" fill="#f97316" />
    <circle cx="156" cy="0" r="11" fill="#3b82f6" />
  </g>
</svg>
